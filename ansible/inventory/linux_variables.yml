---
brewfile_location: ~/dotfiles/brew/Brewfile.linux
zdotdir: ~/dotfiles/zsh
# Public default: just the GitHub key needed to clone the private overlay. The full list
# (work keys and org routing) comes from ~/dotfiles-private/ansible/linux.yml when present.
ssh_origins:
  - {name: Github, hostname: github.com, user: git, identityfile: ~/.ssh/github/github,
    location: ~/.ssh/github, primary: true}
stow_directories: [git, config, asdf]
# Private overlay (the `private` role clones it; zsh, git and these playbooks load from it)
private_repo: git@github.com:btukus/dotfiles-private.git
private_dir: ~/dotfiles-private
