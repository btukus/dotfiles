- name: Ensure ~/.config/git directory exists
  file:
    path: ~/.config/git
    state: directory

# Only additional accounts on a shared hostname need URL rewrites. Single-account
# hosts and explicitly primary accounts use their real hostname directly.
- name: Generate git identity routing (insteadOf rewrites) from ssh_origins
  copy:
    dest: ~/.config/git/identity-routing
    content: |
      # Generated by ansible (zsh role) from ssh_origins[].orgs — do NOT edit by hand.
      # Add an org to an origin's `orgs:` list in inventory/*_variables.yml and re-run ansible.
      {% for origin in ssh_origins %}
      {% set same_host = ssh_origins | selectattr('hostname', 'equalto', origin.hostname) | list %}
      {% if same_host | length > 1 and not (origin.primary | default(false)) %}
      {% for org in origin.orgs | default([]) %}
      [url "git@{{ origin.name }}:{{ org }}/"]
          insteadOf = git@{{ origin.hostname }}:{{ org }}/
      {% endfor %}
      {% endif %}
      {% endfor %}

# Per-org commit email: a repo whose remote points at an org of an origin with an `email:`
# gets that address. Matched against the URL as written (before insteadOf), in each form a
# remote can take. Included after the private overlay in git/.gitconfig, so it wins.
- name: Write each origin's git identity
  copy:
    dest: "~/.config/git/identity-{{ item.name }}"
    content: |
      # Generated by ansible (zsh role) from ssh_origins[].email — do NOT edit by hand.
      [user]
          email = {{ item.email }}
  loop: "{{ ssh_origins | selectattr('email', 'defined') | list }}"

- name: Generate per-org email routing from ssh_origins
  copy:
    dest: ~/.config/git/identity-emails
    content: |
      # Generated by ansible (zsh role) from ssh_origins[].email — do NOT edit by hand.
      {% for origin in ssh_origins if origin.email is defined %}{% for org in origin.orgs | default([]) %}
      {% for url in ['git@' ~ origin.hostname ~ ':', 'git@' ~ origin.name ~ ':', 'ssh://git@' ~ origin.hostname ~ '/', 'https://' ~ origin.hostname ~ '/'] %}
      [includeIf "hasconfig:remote.*.url:{{ url }}{{ org }}/**"]
          path = ~/.config/git/identity-{{ origin.name }}
      {% endfor %}{% endfor %}{% endfor %}
