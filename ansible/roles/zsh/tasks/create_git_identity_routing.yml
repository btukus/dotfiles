- name: Ensure ~/.config/git directory exists
  file:
    path: ~/.config/git
    state: directory

- name: Find origins that need a per-org git identity
  set_fact:
    git_keyed_origins: >-
      {%- set keyed = [] -%}
      {%- for origin in ssh_origins -%}
      {%- if origin.orgs is defined and not (origin.primary | default(false))
            and (ssh_origins | selectattr('hostname', 'equalto', origin.hostname) | list | length) > 1 -%}
      {%- set _ = keyed.append(origin.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ keyed }}

# One identity per org. An `orgs:` entry is either an org name, which takes the origin's
# `email:`/`git_name:`, or a mapping {name, email, git_name} that overrides them for that
# org, e.g. two orgs reached with the same key but committing under different identities.
- name: Collect each org's git identity
  set_fact:
    git_identities: >-
      {%- set ids = [] -%}
      {%- for origin in ssh_origins -%}
      {%- for org in origin.orgs | default([]) -%}
      {%- set o = org if org is mapping else {'name': org} -%}
      {%- set id = {'origin': origin, 'org': o.name,
                    'file': origin.name ~ '-' ~ o.name,
                    'email': o.email | default(origin.email | default('')),
                    'git_name': o.git_name | default(origin.git_name | default('')),
                    'keyed': origin.name in git_keyed_origins} -%}
      {%- if id.email or id.git_name or id.keyed -%}
      {%- set _ = ids.append(id) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ids }}

# Remotes keep their real hostname: an extra account on a shared hostname is picked by
# core.sshCommand below, not by rewriting URLs to its ssh alias. Remove the old rewrites.
- name: Remove the old git identity routing (insteadOf rewrites)
  file:
    path: ~/.config/git/identity-routing
    state: absent

- name: Find old per-origin identity files
  find:
    paths: ~/.config/git
    patterns: "identity-*"
    excludes: ["identity-emails", "identity-routing"]
  register: git_identity_files

- name: Remove identity files no longer generated
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ git_identity_files.files }}"
  when: (item.path | basename | regex_replace('^identity-', '')) not in (git_identities | map(attribute='file') | list)

# Per-org identity: a repo whose remote points at an org gets that org's commit email and
# name (if set) and, when its origin is an extra account on a shared hostname, the origin's
# SSH key (with -F /dev/null, else the hostname's primary key in ~/.ssh/config is offered
# first). Matched in each form a remote can take, including the ssh alias so old remotes
# still match. Included after the private overlay in git/.gitconfig.
- name: Write each org's git identity
  copy:
    dest: "~/.config/git/identity-{{ item.file }}"
    content: |
      # Generated by ansible (zsh role) from ssh_origins. Do NOT edit by hand.
      {% if item.email or item.git_name %}
      [user]
      {% if item.git_name %}
          name = {{ item.git_name }}
      {% endif %}
      {% if item.email %}
          email = {{ item.email }}
      {% endif %}
      {% endif %}
      {% if item.keyed %}
      [core]
          sshCommand = ssh -F /dev/null -i {{ item.origin.identityfile }} -o IdentitiesOnly=yes
      {% endif %}
  loop: "{{ git_identities }}"
  loop_control:
    label: "{{ item.file }}"

- name: Generate per-org identity routing from ssh_origins
  copy:
    dest: ~/.config/git/identity-emails
    content: |
      # Generated by ansible (zsh role) from ssh_origins. Do NOT edit by hand.
      {% for id in git_identities %}
      {% for url in ['git@' ~ id.origin.hostname ~ ':', 'git@' ~ id.origin.name ~ ':', 'ssh://git@' ~ id.origin.hostname ~ '/', 'https://' ~ id.origin.hostname ~ '/'] %}
      [includeIf "hasconfig:remote.*.url:{{ url }}{{ id.org }}/**"]
          path = ~/.config/git/identity-{{ id.file }}
      {% endfor %}{% endfor %}
