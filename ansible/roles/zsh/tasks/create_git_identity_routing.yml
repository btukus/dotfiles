- name: Ensure ~/.config/git directory exists
  file:
    path: ~/.config/git
    state: directory

- name: Find origins that need a per-org git identity
  set_fact:
    git_keyed_origins: >-
      {%- set keyed = [] -%}
      {%- for origin in ssh_origins -%}
      {%- if origin.orgs is defined and not (origin.primary | default(false))
            and (ssh_origins | selectattr('hostname', 'equalto', origin.hostname) | list | length) > 1 -%}
      {%- set _ = keyed.append(origin.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ keyed }}

- name: Collect origins with an email or SSH key to route
  set_fact:
    git_identity_origins: >-
      {{ ssh_origins | selectattr('email', 'defined') | list
         + ssh_origins | selectattr('name', 'in', git_keyed_origins) | rejectattr('email', 'defined') | list }}

# Remotes keep their real hostname: an extra account on a shared hostname is picked by
# core.sshCommand below, not by rewriting URLs to its ssh alias. Remove the old rewrites.
- name: Remove the old git identity routing (insteadOf rewrites)
  file:
    path: ~/.config/git/identity-routing
    state: absent

# Per-org identity: a repo whose remote points at an org of an origin gets that origin's
# commit email (if it has an `email:`) and, when it is an extra account on a shared
# hostname, its SSH key (with -F /dev/null, else the hostname's primary key in ~/.ssh/config
# is offered first). Matched in each form a remote can take, including the ssh alias so
# old remotes still match. Included after the private overlay in git/.gitconfig.
- name: Write each origin's git identity
  copy:
    dest: "~/.config/git/identity-{{ item.name }}"
    content: |
      # Generated by ansible (zsh role) from ssh_origins — do NOT edit by hand.
      {% if item.email is defined %}
      [user]
          email = {{ item.email }}
      {% endif %}
      {% if item.name in git_keyed_origins %}
      [core]
          sshCommand = ssh -F /dev/null -i {{ item.identityfile }} -o IdentitiesOnly=yes
      {% endif %}
  loop: "{{ git_identity_origins }}"

- name: Generate per-org identity routing from ssh_origins
  copy:
    dest: ~/.config/git/identity-emails
    content: |
      # Generated by ansible (zsh role) from ssh_origins — do NOT edit by hand.
      {% for origin in git_identity_origins %}{% for org in origin.orgs | default([]) %}
      {% for url in ['git@' ~ origin.hostname ~ ':', 'git@' ~ origin.name ~ ':', 'ssh://git@' ~ origin.hostname ~ '/', 'https://' ~ origin.hostname ~ '/'] %}
      [includeIf "hasconfig:remote.*.url:{{ url }}{{ org }}/**"]
          path = ~/.config/git/identity-{{ origin.name }}
      {% endfor %}{% endfor %}{% endfor %}
