# tmux, started by Ghostty windows and SSH logins (zsh/source-scripts/tmux-autostart.zsh).
# Everything is Alt-based, with no prefix needed for the common actions:
#   Alt-<key>        direct actions (Ghostty's Cmd keys send these on macOS)
#   Alt-f then <key> the prefix table (tmux's own defaults still work there too)
# Alt-? shows the cheatsheet (tmux/cheatsheet.txt). Reload: Alt-f r.

# --- Terminal and behavior ---------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard,xterm-256color:RGB:clipboard"
set -g escape-time 0                  # Esc reaches nvim at once
set -g focus-events on
set -g allow-passthrough on           # image protocols and OSC sequences reach Ghostty
set -g set-clipboard on               # copies (and OSC 52 from apps, also over SSH) reach the system clipboard
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 600
set -g display-time 1500
setw -g mode-keys vi
set -g status-keys emacs

# Name tabs like the prompt: the running command, or the folder at the prompt. `tw <name>`
# pins a name (rename-window turns automatic-rename off); `tw` alone unpins it.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
set -g status-interval 5

# --- Keys: root table (no prefix) -------------------------------------------
set -g prefix M-f
unbind C-b
bind M-f send-prefix                  # Alt-f Alt-f sends a literal Alt-f

bind -n M-? display-popup -E -w 104 -h 34 -T ' tmux keys (q to close) ' 'less --mouse ~/.config/tmux/cheatsheet.txt'

# Ctrl-hjkl crosses nvim splits and tmux panes (nvim side: smart-splits.nvim, which sets @pane-is-vim)
bind -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' 'select-pane -R'

# Alt-Shift-hjkl: swap the pane with its neighbour that way, focus follows it
bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'

bind -n M-- split-window -v -c '#{pane_current_path}'    # Cmd-j
bind -n M-| split-window -h -c '#{pane_current_path}'    # Cmd-k
bind -n M-b break-pane                                    # pane -> its own new tab
bind -n M-< join-pane -h -t ':-1'                         # pane -> into the previous tab
bind -n M-> join-pane -h -t ':+1'                         # pane -> into the next tab
bind -n M-z resize-pane -Z
bind -n M-Space next-layout                               # cycle tab layouts
bind -n M-t new-window -c '#{pane_current_path}'          # new tab in this pane's directory
bind -n M-w kill-pane
bind -n M-p swap-window -t -1                             # move tab left/right
bind -n M-n swap-window -t +1
bind -n M-i send-keys C-l                                 # clear screen
bind -n M-v copy-mode                                     # Cmd-f

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Sessions 1..9 (Opt-1..9): switch to the session named after the number, creating it if needed.
# Ghostty sends Alt-F1..F9 for left-Opt-1..9, since Cmd-1..9 already arrive as Alt-1..9.
bind -n M-F1 new-session -A -s 1 -c '#{pane_current_path}'
bind -n M-F2 new-session -A -s 2 -c '#{pane_current_path}'
bind -n M-F3 new-session -A -s 3 -c '#{pane_current_path}'
bind -n M-F4 new-session -A -s 4 -c '#{pane_current_path}'
bind -n M-F5 new-session -A -s 5 -c '#{pane_current_path}'
bind -n M-F6 new-session -A -s 6 -c '#{pane_current_path}'
bind -n M-F7 new-session -A -s 7 -c '#{pane_current_path}'
bind -n M-F8 new-session -A -s 8 -c '#{pane_current_path}'
bind -n M-F9 new-session -A -s 9 -c '#{pane_current_path}'

# Popups that keep running while hidden: each is a hidden session (_scratch, _k9s) shown in a
# popup. The same key inside the popup detaches it, which hides it; q in k9s ends it.
bind -n M-j if -F '#{m:_*,#{session_name}}' 'detach-client' \
  "display-popup -E -w 94% -h 92% -d '#{pane_current_path}' 'env -u TMUX tmux new-session -A -s _scratch \\; set status off'"
bind -n M-k if -F '#{m:_*,#{session_name}}' 'detach-client' \
  "display-popup -E -w 94% -h 92% 'env -u TMUX tmux new-session -A -s _k9s k9s \\; set status off'"

# Sessions: switcher (Alt-s, popup sessions hidden) and project picker (Alt-o, repos/worktrees under ~/code)
bind -n M-s choose-tree -Zs -f '#{?#{m:_*,#{session_name}},0,1}'
bind -n M-o display-popup -E -w 80% -h 80% -T ' projects ' '~/dotfiles/scripts/tmux-sessionizer'

# F12: pass every key through to a nested tmux (e.g. over SSH) until F12 again
bind -n F12 set prefix None \; set key-table off \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; refresh-client -S

# --- Keys: prefix table (Alt-f then ...) ----------------------------------------
bind M-k split-window -h -c '#{pane_current_path}'
bind %   split-window -h -c '#{pane_current_path}'
bind M-j split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind . command-prompt -I '#T' "select-pane -T '%%'"      # rename pane (, renames the tab)
bind x kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize: Alt-f Ctrl-hjkl, and keep pressing Ctrl-hjkl
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 3
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

# --- Copy mode (Alt-v) -----------------------------------------------------------
# Mouse selection copies on release. v/V/C-v select, y copies, / ? search, e opens the
# scrollback in nvim, q quits.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi e send -X cancel \; \
  run-shell 'mkdir -p ~/.cache/tmux && tmux capture-pane -pJ -S - -t "#{pane_id}" > ~/.cache/tmux/scrollback' \; \
  display-popup -E -w 100% -h 100% 'nvim + ~/.cache/tmux/scrollback'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# --- Nord look ---------------------------------------------------------------------
# One status line at the bottom. Left: mode badge (icon normally, colored label in prefix /
# copy / locked) and tabs as flat blocks; right: date and time. Square edges on purpose:
# Ghostty fills the few pixels under the bar with each cell's background.
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#3b4252 fg=#d8dee9'
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "#{?#{==:#{client_key_table},off},#[bg=#bf616a]#[fg=#2e3440]#[bold]  LOCKED ,#{?client_prefix,#[bg=#ebcb8b]#[fg=#2e3440]#[bold]  PREFIX ,#{?pane_in_mode,#[bg=#81a1c1]#[fg=#2e3440]#[bold]  COPY ,#[bg=#88c0d0]#[fg=#2e3440]#[bold]  }}}#[default] "
set -g status-right '#[bg=#88c0d0 fg=#2e3440 bold]  %a %d %b   %H:%M '
set -g window-status-separator ''
setw -g window-status-format '#[bg=#434c5e fg=#d8dee9] #I #W#{?window_zoomed_flag, ,} #[default] '
setw -g window-status-current-format '#[bg=#88c0d0 fg=#2e3440 bold] #I #W#{?window_zoomed_flag, ,} #[default] '
setw -g window-status-activity-style none
setw -g window-status-current-style default   # tmux 3.8 underlines the current tab by default
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#88c0d0'
set -g popup-border-style 'fg=#88c0d0'
set -g popup-border-lines rounded
set -g message-style 'bg=#3b4252 fg=#88c0d0'
set -g message-command-style 'bg=#3b4252 fg=#88c0d0'
setw -g mode-style 'bg=#4c566a fg=#eceff4'
setw -g clock-mode-colour '#88c0d0'

# --- Plugins (cloned on the first start) ------------------------------------------
# tmux-resurrect + tmux-continuum: sessions are saved every 15 minutes and restored when the
# tmux server starts (e.g. after a reboot), with pane contents. Alt-f C-s / C-r save / restore
# by hand. The popup sessions are dropped after a restore: they'd come back as plain shells.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-restore-all 'tmux list-sessions -F "#{session_name}" | grep "^_" | xargs -I{} tmux kill-session -t "={}"'
set -g @continuum-restore 'on'

if 'test ! -d "$TMUX_PLUGIN_MANAGER_PATH/tpm"' \
  'run "git clone -q --depth 1 https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH/tpm && $TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins"'
run '$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm'
